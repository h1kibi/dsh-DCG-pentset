// 实验室 DNS 配置。**刻意的错误**：lab-zone.test 允许任意主机做区域传送（真实环境里这是常见错配，
// 也是 dns_axfr 那条核验要判出来的东西）。
options {
	directory "/var/cache/bind";
	recursion no;                 // 不做递归：它是权威服务器，不是解析器
	listen-on { any; };
	listen-on-v6 { none; };
	dnssec-validation no;         // 实验室：不验 DNSSEC（bind 9.18 已删除 dnssec-enable 选项，别再写）
	allow-transfer { none; };     // 默认拒绝（对未声明的 zone）
};

zone "lab-zone.test" {
	type master;
	file "/etc/bind/db.lab-zone.test";
	allow-transfer { any; };      // ← 故意做错：应写成 allow-transfer { <从库>; }
};

// 对照 zone：**不允许**传送（用来验"被拒"那一半在我们自己手上也能复现）
zone "hardened.test" {
	type master;
	file "/etc/bind/db.hardened.test";
	allow-transfer { none; };
};
